services:
  mealplanner:
    build: .
    container_name: mealplanner
    restart: unless-stopped
    ports:
      # Reachable from your network by default. Use BIND=127.0.0.1 to only allow this machine
      # (for example when a reverse proxy runs in front of it).
      - "${BIND:-0.0.0.0}:${PORT:-8080}:8080"
    environment:
      # Optional: protect the whole app with a password (any user name works).
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      # Optional: allow "fill in from a recipe link" in the meal form (the server fetches the page).
      - ENABLE_URL_IMPORT=${ENABLE_URL_IMPORT:-}
      - GAP_DAYS=${GAP_DAYS:-21}
    volumes:
      - mealplanner-data:/data
volumes:
  mealplanner-data:
